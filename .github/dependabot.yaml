version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    labels:
      - "lang: python"
      - "part: dependencies"

  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns:
          - "*"
    labels:
      - "lang: javascript"
      - "part: dependencies"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns:
          - "*"
    labels:
      - "lang: rust"
      - "part: dependencies"
