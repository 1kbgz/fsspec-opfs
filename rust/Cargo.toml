[package]
name = "fsspec_opfs"
version = "0.1.0"
authors = ["the fsspec-opfs authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-opfs"
description = "Origin Private File System backend for fsspec-rs"

[lib]
name = "fsspec_opfs"
path = "src/lib.rs"
crate-type = ["rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
fsspec_rs = { version = "0.4.1", default-features = false }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
